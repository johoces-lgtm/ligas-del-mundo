spring.application.name=servicio-football-api
server.port=8092

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://bd-mysql:3306/bd_football_api?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:system}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
jwt.secret=${JWT_SECRET:system-system-system-system-system-1234}

eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/

spring.main.allow-bean-definition-overriding=true

api.football.url=https://v3.football.api-sports.io
api.football.key=llave_falsa_porque_ya_tengo_datos