      - "8088:8088"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://bd-mysql:3306/bd_partidos_partido?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=system
      - EUREKA_CLIENT_SERVICE-URL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      - bd-mysql
      - eureka-server
    networks:
      - red-futbol

  servicio-posiciones:
