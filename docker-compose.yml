version: '3.8'

services:
  bd-mysql:
    image: mysql:8.0
    container_name: bd-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "system"
    ports:
      - "3307:3306"
    volumes:
      - data_mysql:/var/lib/mysql
    networks:
      - red-futbol
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psystem"]
      interval: 10s
      timeout: 5s
      retries: 5

  eureka-server:
    build: ./ligas-del-mundo-eureka
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - red-futbol

  api-gateway:
    build: ./2026_1_FullStack1_api-gateway-main
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - EUREKA_CLIENT_SERVICE-URL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
    networks:
      - red-futbol

  # --- SERVICIOS BASTI ---
  servicio-usuarios:
    build: ./ligas-del-mundo-basti-usuarios/usuarios/usuarios
    container_name: servicio-usuarios
    ports:
      - "8091:8091"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://bd-mysql:3306/bd_usuarios?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=system
      - EUREKA_CLIENT_SERVICE-URL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      - bd-mysql
      - eureka-server
    networks:
      - red-futbol

  servicio-auth:
    build: ./ligas-del-mundo-basti-auth/auth/auth
    container_name: servicio-auth
    ports:
      - "8090:8090"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://bd-mysql:3306/bd_auth?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=system
      - EUREKA_CLIENT_SERVICE-URL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      - bd-mysql
      - eureka-server
    networks:
      - red-futbol

  servicio-partidos:
